<div class="min-h-screen bg-slate-950 flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex h-12 w-12 rounded-lg bg-sky-600 items-center justify-center font-bold text-white text-xl shadow-lg shadow-sky-600/20 mb-4">
        IT
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">ImpulseTech</h1>
      <p class="text-sm text-slate-400 mt-1">Centro de Control Operativo & CRM</p>
    </div>

    <!-- Login Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-8 shadow-2xl">
      <div class="mb-6">
        <h2 class="text-lg font-semibold text-white">Iniciar Sesión</h2>
        <p class="text-xs text-slate-400 mt-0.5">Ingresa tus credenciales corporativas para continuar</p>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage()" class="mb-6 p-4 rounded-lg bg-rose-500/10 border border-rose-500/30 flex items-start space-x-3 text-xs text-rose-300">
        <svg class="h-4 w-4 text-rose-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <!-- Email Input -->
        <div>
          <label for="email" class="block text-xs font-medium text-slate-300 mb-1.5">Correo Electrónico</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="usuario@impulsetech.com"
            class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800/80 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all"
            [class.border-rose-500]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
          <span *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-xs text-rose-400 mt-1 block">
            Ingresa un correo electrónico válido.
          </span>
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••••••"
            class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800/80 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all"
            [class.border-rose-500]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <span *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-xs text-rose-400 mt-1 block">
            La contraseña debe tener al menos 6 caracteres.
          </span>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading()"
          class="w-full py-2.5 px-4 rounded-lg bg-sky-600 hover:bg-sky-500 active:bg-sky-700 disabled:opacity-50 disabled:cursor-not-allowed text-sm font-medium text-white shadow-sm shadow-sky-600/30 transition-all flex items-center justify-center space-x-2"
        >
          <svg *ngIf="isLoading()" class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>{{ isLoading() ? 'Validando credenciales...' : 'Iniciar Sesión' }}</span>
        </button>
      </form>
    </div>

    <!-- Security Footer -->
    <div class="mt-8 text-center text-xs text-slate-500">
      Acceso exclusivo para personal autorizado de ImpulseTech.
    </div>
  </div>
</div>
